# SPDX-License-Identifier: GPL-3.0-only
# MuseScore-Studio-CLA-applies
#
# Builds MuseScore Studio for Android (arm64-v8a) as a single APK
# and publishes it as a GitHub release.
# Retry: QML module deployment fix

name: Android APK

on:
  push:
    branches: [main, android-apk]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a GitHub release with the APK'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: write

env:
  QT_VERSION: 6.10.0
  ANDROID_NDK_VERSION: 28.2.13676358
  ANDROID_PLATFORM: android-26

jobs:
  build-apk:
    name: Build Android APK (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/local/lib/android/sdk/ndk-bundle \
                      /usr/local/lib/android/sdk/emulator \
                      /usr/local/lib/android/sdk/tools \
                      /usr/local/lib/android/sdk/cmdline-tools/8.0 \
                      /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/share/dotnet /usr/local/share/boost \
                      /opt/java/graalvm /usr/lib/jvm/graalvm* \
                      /usr/local/lib/node_modules /usr/share/swift
          sudo docker image prune -af > /dev/null 2>&1 || true
          df -h /

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ccache ninja-build patchelf libegl1 libgl1 libxkbcommon0
          python3 -m pip install --break-system-packages py7zr
          echo "CCACHE_DIR=$(ccache -k cache_dir 2>/dev/null || echo ~/.cache/ccache)" >> $GITHUB_ENV

      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Qt and Android SDK/NDK
        run: |
          chmod +x buildscripts/android/setup_env.sh
          QT_VERSION="${QT_VERSION}" \
          ANDROID_NDK_VERSION="${ANDROID_NDK_VERSION}" \
          ANDROID_PLATFORM="${ANDROID_PLATFORM}" \
          QT_BUNDLE_URL="https://github.com/Povo-43/MuseScore/releases/download/build-env/qt-android-${QT_VERSION}.tar.zst" \
          ./buildscripts/android/setup_env.sh
          cat /tmp/qt-android-env.sh >> $GITHUB_ENV
          df -h /

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-android-${{ runner.os }}-qt${{ env.QT_VERSION }}-${{ github.sha }}
          restore-keys: |
            ccache-android-${{ runner.os }}-qt${{ env.QT_VERSION }}-

      - name: Configure
        run: |
          source /tmp/qt-android-env.sh
          cmake -S . -B build -GNinja \
            -DCMAKE_TOOLCHAIN_FILE="${QT_ANDROID_DIR}/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="${QT_HOST_DIR}" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=${ANDROID_PLATFORM} \
            -DANDROID_NDK_ROOT="${ANDROID_NDK_ROOT}" \
            -DANDROID_SDK_ROOT="${ANDROID_SDK_ROOT}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DMUSESCORE_BUILD_CONFIGURATION=app \
            -DMUSE_APP_BUILD_MODE=release \
            -DMUE_DOWNLOAD_SOUNDFONT=OFF \
            -DMUSE_ENABLE_UNIT_TESTS=OFF

      - name: Build APK
        run: |
          source /tmp/qt-android-env.sh
          cmake --build build --parallel $(nproc) 2>&1 | tail -100
          find . -name "*apk*" | head -10
          ccache --show-stats
          df -h /

      - name: Sign APK
        run: |
          source /tmp/qt-android-env.sh
          # androiddeployqt outputs the APK at build/src/app/android-build/MuseScoreStudio.apk
          APK="./build/src/app/android-build/MuseScoreStudio.apk"
          if [ ! -f "${APK}" ]; then
            # Fallback: find any APK from Gradle output
            APK=$(find build/src/app/android-build -name "*.apk" | head -1 || true)
          fi
          if [ -z "${APK}" ] || [ ! -f "${APK}" ]; then
            echo "No APK found"; exit 1
          fi
          echo "=== Signing APK: ${APK} ==="
          OUT="MuseScoreStudio-Android-arm64.apk"
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/34.0.0"

          # Use signing key from GitHub Secrets if provided, otherwise generate a throwaway one
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            KEYSTORE=/tmp/musescore-android.keystore
            echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${KEYSTORE}"
            KEYSTORE_PASS="${ANDROID_KEYSTORE_PASSWORD}"
            KEY_ALIAS="${ANDROID_KEY_ALIAS}"
            KEY_PASS="${ANDROID_KEY_PASSWORD}"
          else
            KEYSTORE=/tmp/musescore-android.keystore
            if [ ! -f "${KEYSTORE}" ]; then
              keytool -genkeypair -v -keystore "${KEYSTORE}" -alias musescore \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -storepass musescore-android -keypass musescore-android \
                -dname "CN=MuseScore Android, OU=MuseScore, O=MuseScore, L=Cyberspace, C=OO"
            fi
            KEYSTORE_PASS=musescore-android
            KEY_ALIAS=musescore
            KEY_PASS=musescore-android
          fi

          echo "=== Zipalign ==="
          ls -la "${BUILD_TOOLS}/zipalign" "${BUILD_TOOLS}/apksigner" 2>&1 || true
          "${BUILD_TOOLS}/zipalign" -f 4 "${APK}" "${OUT}" || { echo "zipalign FAILED"; exit 1; }

          echo "=== Sign APK (jarsigner v1) ==="
          if ! jarsigner -keystore "${KEYSTORE}" \
            -storepass "${KEYSTORE_PASS}" \
            -keypass "${KEY_PASS}" \
            "${OUT}" "${KEY_ALIAS}" 2>&1; then
            echo "jarsigner sign FAILED"
            exit 1
          fi

          echo "=== Verify signature ==="
          if ! jarsigner -verify -verbose -keystore "${KEYSTORE}" "${OUT}" 2>&1; then
            echo "jarsigner verify FAILED"
            exit 1
          fi

          echo "=== Try apksigner v2 signature (if available) ==="
          echo "apksigner --version:"
          "${BUILD_TOOLS}/apksigner" --version 2>&1 || true
          echo "java version:"
          java -version 2>&1 || true
          if "${BUILD_TOOLS}/apksigner" sign --ks "${KEYSTORE}" \
            --ks-pass pass:"${KEYSTORE_PASS}" --key-pass pass:"${KEY_PASS}" \
            --ks-key-alias "${KEY_ALIAS}" \
            --v1-signing-enabled true --v2-signing-enabled true \
            --min-sdk-version 28 \
            --out "${OUT}" "${OUT}" 2>&1; then
            echo "apksigner v2 sign SUCCESS"
          else
            echo "apksigner v2 sign FAILED, keeping v1-only APK from jarsigner"
          fi

          echo "=== Debug: file type ==="
          file "${OUT}" 2>&1 || true
          echo "=== Debug: zip test ==="
          unzip -t "${OUT}" 2>&1 | head -20 || true
          echo "=== Debug: first entries ==="
          unzip -l "${OUT}" 2>&1 | head -20 || true
          echo "=== Debug: classes.dex ==="
          unzip -l "${OUT}" 2>&1 | grep -i "classes.dex\|resources.arsc\|AndroidManifest" || true
          echo "=== Debug: manifest ==="
          unzip -p "${OUT}" AndroidManifest.xml 2>&1 | head -10 || true
          echo "=== Debug: hexdump ==="
          od -A x -t x1z -N 64 "${OUT}" 2>&1 || true

          ls -lh "${OUT}"
          echo "APK_FILE=${OUT}" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MuseScoreStudio-Android-arm64
          path: MuseScoreStudio-Android-arm64.apk
          if-no-files-found: error

      - name: Create release
        if: ${{ github.event_name == 'push' || github.event.inputs.publish_release == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-alpha.${{ github.run_number }}"
          gh release create "${TAG}" "${APK_FILE}" \
            --title "MuseScore Studio for Android (arm64) — alpha ${TAG}" \
            --notes "Experimental build of MuseScore Studio for Android (arm64-v8a).

          - Qt 6.10, AAudio audio output
          - Bundled resources (soundfont, templates, styles) are copied into app storage on first launch
          - Not available: MuseSampler/MuseSounds, VST, MuseScore.com cloud, printing (PDF export is available through export)
          - Self-signed APK: install by allowing installation from unknown sources" \
            --prerelease
